apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-portal
  labels:
    app: hospital-portal
  annotations:
    kubernetes.io/change-cause: "Initial release"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 60
  minReadySeconds: 5
  selector:
    matchLabels:
      app: hospital-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hospital-portal
    spec:
      containers:
        - name: hospital-portal
          image: adityarajarora123/hospital-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
